<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Job Hunter AI - Trích xuất JD & Lưu Bảng tính</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .paste-active {
      border-color: #3b82f6 !important;
      background-color: #eff6ff !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center p-3 bg-blue-600 text-white rounded-2xl shadow-lg mb-3">
        <i class="fa-solid fa-bullseye text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Trợ Lý Ứng Tuyển Việc Làm AI</h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">Chụp ảnh màn hình JD dán vào (Ctrl+V) ➔ Gemini phân tích ➔ Tự lưu Drive & Google Sheets</p>
    </div>

    <!-- Khối Cài Đặt (API Key & Webhook) -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <div class="flex items-center justify-between cursor-pointer" onclick="toggleConfig()">
        <div class="flex items-center gap-2 font-semibold text-slate-700">
          <i class="fa-solid fa-gear text-blue-600"></i>
          <span>Cấu hình Hệ thống (Lưu trên máy cá nhân)</span>
        </div>
        <i id="configChevron" class="fa-solid fa-chevron-down text-slate-400 transition-transform"></i>
      </div>

      <div id="configSection" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-100">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">
            Gemini API Key <a href="https://aistudio.google.com" target="_blank" class="text-blue-500 font-normal hover:underline">(Lấy miễn phí tại AI Studio)</a>
          </label>
          <input type="password" id="geminiApiKey" placeholder="AIzaSy..." 
            class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">
            Google Apps Script Webhook URL
          </label>
          <input type="url" id="webhookUrl" placeholder="https://script.google.com/macros/s/.../exec" 
            class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>
        <div class="md:col-span-2 flex justify-end">
          <button onclick="saveSettings()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium transition">
            <i class="fa-solid fa-floppy-disk mr-1"></i> Lưu cấu hình vào trình duyệt
          </button>
        </div>
      </div>
    </div>

    <!-- Form Nhập & Paste JD -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-paste text-blue-600"></i>
        <span>Nội dung Tin tuyển dụng (JD)</span>
      </h2>

      <!-- Ô Textarea hỗ trợ Paste ảnh Ctrl+V -->
      <div class="relative mb-4">
        <textarea id="jdInput" rows="6" 
          placeholder="👉 Cách nhanh nhất: Bấm Win+Shift+S chụp màn hình tin tuyển dụng, sau đó nhấp chuột vào đây và ấn Ctrl + V để dán ảnh!&#10;&#10;Hoặc bạn cũng có thể dán toàn bộ đoạn văn bản mô tả công việc (Text JD) vào đây..."
          class="w-full p-4 text-sm text-slate-700 rounded-xl border-2 border-dashed border-slate-300 focus:outline-none focus:border-blue-500 focus:bg-white bg-slate-50/50 transition resize-y"></textarea>
      </div>

      <!-- Preview ảnh/file khi vừa paste hoặc upload -->
      <div id="filePreviewContainer" class="hidden mb-4 p-4 bg-blue-50/60 rounded-xl border border-blue-200">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-blue-800 uppercase flex items-center gap-1">
            <i class="fa-solid fa-file-image text-blue-600"></i> File/Ảnh đã sẵn sàng tải lên Google Drive:
          </span>
          <button onclick="removeAttachedFile()" class="text-xs text-red-500 hover:text-red-700 font-semibold">
            <i class="fa-solid fa-trash-can mr-1"></i> Gỡ bỏ
          </button>
        </div>
        <div class="flex items-center gap-3">
          <img id="previewImg" src="" alt="JD Preview" class="hidden max-h-36 rounded-lg shadow-sm border border-slate-200 object-contain bg-white p-1">
          <div id="previewDocInfo" class="hidden text-xs text-slate-600">
            <i class="fa-solid fa-file-pdf text-red-500 text-2xl mr-2"></i>
            <span id="docFileName" class="font-medium text-slate-800"></span>
          </div>
        </div>
      </div>

      <!-- Tùy chọn tải file thủ công & các thông tin bổ sung -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Hoặc Chọn File Ảnh / PDF từ máy</label>
          <input type="file" id="fileUploadInput" accept="image/*,application/pdf" class="block w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Link bài đăng gốc (Tùy chọn)</label>
          <input type="url" id="originalUrlInput" placeholder="https://linkedin.com/jobs/..." class="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Link CV đã chuẩn bị (Tùy chọn)</label>
          <input type="url" id="cvUrlInput" placeholder="https://drive.google.com/file/..." class="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <!-- Nút hành động chính -->
      <div class="flex items-center gap-3">
        <button id="submitBtn" onclick="processAndSubmit()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span id="btnText">Phân Tích Bằng Gemini & Đẩy Lên Sheet</span>
        </button>
        <button onclick="resetForm()" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition" title="Làm mới">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <!-- Khối Thông Báo Kết Quả -->
    <div id="resultBox" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6 transition-all">
      <div class="flex items-center gap-3 text-emerald-600 mb-4">
        <i class="fa-solid fa-circle-check text-2xl"></i>
        <h3 class="font-bold text-lg text-slate-900">Đã Trích Xuất & Lưu Thành Công!</h3>
      </div>
      <div id="parsedContent" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm bg-slate-50 p-4 rounded-xl border border-slate-200">
        <!-- Dữ liệu render động bằng JS -->
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Khởi tạo các biến toàn cục
    let capturedFileBase64 = null;
    let capturedFileName = "";
    let capturedFileType = "";

    // Tải cấu hình khi vừa mở trang
    window.addEventListener("DOMContentLoaded", () => {
      const savedApiKey = localStorage.getItem("gemini_api_key");
      const savedWebhook = localStorage.getItem("webhook_url");
      if (savedApiKey) document.getElementById("geminiApiKey").value = savedApiKey;
      if (savedWebhook) document.getElementById("webhookUrl").value = savedWebhook;
      
      // Nếu đã có cấu hình thì tự thu gọn ô cấu hình
      if (savedApiKey && savedWebhook) {
        document.getElementById("configSection").classList.add("hidden");
        document.getElementById("configChevron").classList.add("-rotate-90");
      }
    });

    function toggleConfig() {
      const sec = document.getElementById("configSection");
      const chevron = document.getElementById("configChevron");
      sec.classList.toggle("hidden");
      chevron.classList.toggle("-rotate-90");
    }

    function saveSettings() {
      const apiKey = document.getElementById("geminiApiKey").value.trim();
      const webhook = document.getElementById("webhookUrl").value.trim();
      localStorage.setItem("gemini_api_key", apiKey);
      localStorage.setItem("webhook_url", webhook);
      alert("✅ Đã lưu cấu hình vào trình duyệt của bạn!");
    }

    // ========================================================================
    // 1. TỰ ĐỘNG BẮT SỰ KIỆN PASTE (CTRL+V) TRÊN TEXTAREA ĐỂ NHẬN ẢNH CLIPBOARD
    // ========================================================================
    const jdInput = document.getElementById("jdInput");

    jdInput.addEventListener("paste", function (e) {
      const items = (e.clipboardData || window.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          e.preventDefault(); // Ngăn dán chuỗi nhị phân rác
          const blob = items[i].getAsFile();
          handleIncomingFile(blob, "screenshot_clipboard.png", items[i].type);
          break;
        }
      }
    });

    // 2. Xử lý khi người dùng chọn file bằng thẻ <input type="file">
    document.getElementById("fileUploadInput").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) {
        const file = e.target.files[0];
        handleIncomingFile(file, file.name, file.type);
      }
    });

    function handleIncomingFile(file, defaultName, mimeType) {
      const reader = new FileReader();
      reader.onload = function (evt) {
        capturedFileBase64 = evt.target.result;
        capturedFileName = defaultName;
        capturedFileType = mimeType || file.type || "image/png";

        // Cập nhật giao diện Preview
        document.getElementById("filePreviewContainer").classList.remove("hidden");
        const previewImg = document.getElementById("previewImg");
        const previewDoc = document.getElementById("previewDocInfo");

        if (capturedFileType.startsWith("image/")) {
          previewImg.src = capturedFileBase64;
          previewImg.classList.remove("hidden");
          previewDoc.classList.add("hidden");
          jdInput.placeholder = "📸 [ĐÃ NHẬN ẢNH CHỤP MÀN HÌNH] Bạn có thể nhập thêm ghi chú vào đây nếu muốn, hoặc nhấn nút Phân tích ngay!";
        } else {
          previewImg.classList.add("hidden");
          previewDoc.classList.remove("hidden");
          document.getElementById("docFileName").innerText = capturedFileName;
          jdInput.placeholder = "📄 [ĐÃ NHẬN FILE PDF] Bạn có thể nhập thêm ghi chú hoặc nhấn nút Phân tích ngay!";
        }
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedFile() {
      capturedFileBase64 = null;
      capturedFileName = "";
      capturedFileType = "";
      document.getElementById("filePreviewContainer").classList.add("hidden");
      document.getElementById("previewImg").src = "";
      document.getElementById("fileUploadInput").value = "";
      jdInput.placeholder = "👉 Cách nhanh nhất: Bấm Win+Shift+S chụp màn hình tin tuyển dụng...";
    }

    function resetForm() {
      jdInput.value = "";
      document.getElementById("originalUrlInput").value = "";
      document.getElementById("cvUrlInput").value = "";
      removeAttachedFile();
      document.getElementById("resultBox").classList.add("hidden");
    }

    // ========================================================================
    // 3. GỌI GEMINI 1.5 FLASH & GỬI DỮ LIỆU ĐẾN APPS SCRIPT WEBHOOK
    // ========================================================================
    async function processAndSubmit() {
      const apiKey = document.getElementById("geminiApiKey").value.trim();
      const webhookUrl = document.getElementById("webhookUrl").value.trim();
      const textContent = jdInput.value.trim();
      const originalUrl = document.getElementById("originalUrlInput").value.trim();
      const cvUrl = document.getElementById("cvUrlInput").value.trim();

      if (!apiKey) {
        alert("⚠️ Vui lòng nhập Gemini API Key ở phần Cấu hình trước!");
        toggleConfig();
        return;
      }
      if (!webhookUrl) {
        alert("⚠️ Vui lòng nhập Webhook URL của Google Apps Script ở phần Cấu hình trước!");
        toggleConfig();
        return;
      }
      if (!textContent && !capturedFileBase64) {
        alert("⚠️ Hãy dán ảnh chụp màn hình (Ctrl+V) hoặc nhập nội dung văn bản JD!");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-70", "cursor-not-allowed");
      btnText.innerText = "Gemini AI đang bóc tách JD...";

      try {
        // A. Chuẩn bị Prompt có cấu trúc JSON chính xác
        const prompt = `Bạn là chuyên gia nhân sự. Hãy đọc kỹ nội dung/hình ảnh bản tin tuyển dụng (JD) này và trích xuất thông tin thành duy nhất một chuỗi JSON hợp lệ (không bao gồm markdown \`\`\`json hay bất kỳ lời dẫn nào khác):
{
  "company_name": "Tên công ty tuyển dụng",
  "job_title": "Chức danh/vị trí ứng tuyển",
  "salary": "Mức lương ghi trong JD (hoặc 'Thỏa thuận')",
  "working_time": "Thời gian/Ca làm việc (Ví dụ: Giờ hành chính T2-T6, Full-time, Ca xoay,...)",
  "requirements": "3-4 kỹ năng hoặc yêu cầu cốt lõi nhất, cách nhau bằng dấu phẩy",
  "jd_summary": "Tóm tắt trách nhiệm chính ngắn gọn trong 1-2 câu",
  "location": "Địa điểm làm việc (Hà Nội, TP.HCM, Remote, Hybrid,...)",
  "contact": "Email hoặc số điện thoại liên hệ HR"
}`;

        const parts = [{ text: prompt }];

        if (capturedFileBase64) {
          // Bóc tách base64
          const base64Data = capturedFileBase64.split(",")[1];
          const mimeType = capturedFileBase64.split(";")[0].replace("data:", "");
          parts.push({
            inline_data: { mime_type: mimeType, data: base64Data }
          });
        }
        if (textContent) {
          parts.push({ text: "\n\nNỘI DUNG VĂN BẢN ĐÍNH KÈM:\n" + textContent });
        }

        // B. Gọi Gemini 1.5 Flash API
        const geminiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const aiResponse = await fetch(geminiEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: parts }] })
        });

        if (!aiResponse.ok) {
          throw new Error("Lỗi gọi Gemini API: " + (await aiResponse.text()));
        }

        const aiResult = await aiResponse.json();
        const rawJsonText = aiResult.candidates[0].content.parts[0].text.trim();
        const cleanedJson = rawJsonText.replace(/```json|```/g, "").trim();
        const parsedPayload = JSON.parse(cleanedJson);

        // C. Bổ sung các thông tin đính kèm để đẩy lên Apps Script
        btnText.innerText = "Đang tải ảnh lên Drive & ghi Sheets...";
        
        if (capturedFileBase64) {
          parsedPayload.jd_file_base64 = capturedFileBase64;
          const safeComp = (parsedPayload.company_name || "Job").replace(/[^a-zA-Z0-9]/g, "_");
          parsedPayload.jd_file_name = `JD_${safeComp}_${Date.now()}.${capturedFileType.includes("pdf") ? "pdf" : "png"}`;
        }
        parsedPayload.original_jd_link = originalUrl || "";
        parsedPayload.cv_link = cvUrl || "";
        parsedPayload.status = "Chưa gửi CV";

        // D. Gửi dữ liệu sang Google Apps Script qua Webhook (mode no-cors để tránh chặn CORS trình duyệt)
        await fetch(webhookUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(parsedPayload)
        });

        // E. Hiển thị kết quả trích xuất lên giao diện
        displaySuccessResult(parsedPayload);

      } catch (err) {
        console.error(err);
        alert("❌ Đã có lỗi xảy ra: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-70", "cursor-not-allowed");
        btnText.innerText = "Phân Tích Bằng Gemini & Đẩy Lên Sheet";
      }
    }

    function displaySuccessResult(data) {
      const container = document.getElementById("parsedContent");
      container.innerHTML = `
        <div><strong class="text-slate-600">🏢 Công ty:</strong> <span class="text-slate-900 font-semibold">${data.company_name || "N/A"}</span></div>
        <div><strong class="text-slate-600">💼 Vị trí:</strong> <span class="text-slate-900 font-semibold">${data.job_title || "N/A"}</span></div>
        <div><strong class="text-slate-600">💰 Mức lương:</strong> <span class="text-emerald-600 font-medium">${data.salary || "Thỏa thuận"}</span></div>
        <div><strong class="text-slate-600">⏰ Giờ làm việc:</strong> <span>${data.working_time || "N/A"}</span></div>
        <div><strong class="text-slate-600">📍 Địa điểm:</strong> <span>${data.location || "N/A"}</span></div>
        <div><strong class="text-slate-600">📞 Liên hệ:</strong> <span>${data.contact || "N/A"}</span></div>
        <div class="md:col-span-2"><strong class="text-slate-600">🎯 Yêu cầu chính:</strong> <span>${data.requirements || "N/A"}</span></div>
        <div class="md:col-span-2"><strong class="text-slate-600">📝 Tóm tắt JD:</strong> <p class="mt-1 text-slate-700 italic">${data.jd_summary || "N/A"}</p></div>
      `;
      document.getElementById("resultBox").classList.remove("hidden");
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  </script>
</body>
</html>
